name = "mildmate-cron"
main = "index.ts"
compatibility_date = "2024-04-29"

# Cron trigger — runs every hour, gates on cron_hour_utc from D1 recovery_config
[triggers]
crons = ["0 * * * *"]

# Same D1 database as Pages project (production)
[[d1_databases]]
binding = "DB"
database_name = "mildmate-db-prod"
database_id = "854f206a-b240-491c-bb91-7e064736d487"
