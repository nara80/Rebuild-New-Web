name = "mildmate-marketing-sync"
main = "index.js"
# Pinned to the newest date the installed wrangler (4.100.0) runtime supports.
# Raise this only together with a wrangler upgrade, or `wrangler dev` fails to start.
compatibility_date = "2026-06-18"

# Bi-weekly Notion mapper pass + hourly drain for carry-over work,
# plus weekly GSC and shared GA4+Etsy+Google Ads collector passes.
# Cron cannot express a true 14-day interval; the 1st and 15th at 02:00 UTC
# (09:00 Bangkok) is deterministic and needs no extra state. The hourly entry
# returns immediately unless the previous run stopped bounded with work left.
# GSC runs weekly on Monday 03:00 UTC with an overlap window (configurable).
# GA4, Etsy, and Google Ads run weekly on Monday 04:00 UTC with overlap windows (configurable).
[triggers]
crons = ["0 2 1,15 * *", "0 * * * *", "0 3 * * 1", "0 4 * * 1"]

# PRODUCTION D1 — this Worker reads/writes live sales tables (sales_orders,
# sales_order_items, sync_runs, product_mapping_events, marketing_sync_*).
# Note: cron-worker/ points at the preview database; this one must not.
[[d1_databases]]
binding = "DB"
database_name = "mildmate-db-prod"
database_id = "854f206a-b240-491c-bb91-7e064736d487"
migrations_dir = "./migrations"

[vars]
MAPPER_API_BASE = "https://www.mildmate.com"
GSC_API_BASE = "https://www.mildmate.com"
GSC_SITE_URL = "sc-domain:mildmate.com"
GSC_SEARCH_TYPE = "web"
GSC_OVERLAP_DAYS = "14"
GSC_DATA_LAG_DAYS = "3"
GA4_API_BASE = "https://www.mildmate.com"
GA4_PROPERTY_ID = "366290587"
GA4_OVERLAP_DAYS = "14"
GA4_DATA_LAG_DAYS = "2"
# Each upserted row costs ~2 D1 statements in the Pages ingestion API, which is
# capped at ~1000 subrequests per invocation; keep chunks well under that.
GA4_UPSERT_CHUNK_SIZE = "400"
ETSY_API_BASE = "https://openapi.etsy.com"
ETSY_OVERLAP_DAYS = "14"
ETSY_DATA_LAG_DAYS = "1"
GOOGLE_ADS_API_BASE = "https://googleads.googleapis.com"
GOOGLE_ADS_OVERLAP_DAYS = "14"
GOOGLE_ADS_DATA_LAG_DAYS = "2"
# Required Google Ads account id (without hyphens), example: 1234567890
GOOGLE_ADS_CUSTOMER_ID = "5242681268"
# Required manager account id (without hyphens) for linked-account access:
GOOGLE_ADS_LOGIN_CUSTOMER_ID = "4572877507"
# Optional account currency fallback for spend/value rows:
# GOOGLE_ADS_ACCOUNT_CURRENCY = "THB"
# Optional Etsy conversion helper for non-THB rows if source rows omit revenue_thb.
# ETSY_FX_TO_THB = "35"
# Optional GA4 event-name overrides (comma-separated). Defaults:
# view_item, add_to_cart, begin_checkout, purchase
# GA4_EVENT_VIEW_ITEM_NAMES = "view_item"
# GA4_EVENT_ADD_TO_CART_NAMES = "add_to_cart"
# GA4_EVENT_BEGIN_CHECKOUT_NAMES = "begin_checkout"
# GA4_EVENT_PURCHASE_NAMES = "purchase"
# Date scope for ongoing runs. "rolling-prev-month" (default when unset) holds
# back the current and previous month, matching the operator's correction
# cadence (month M is finalised during M+1). Set SYNC_BEFORE_MODE = "none" to
# rely only on the TotalAmount rule, or SYNC_BEFORE_FIXED = "YYYY-MM-DD" to pin.
SYNC_BEFORE_MODE = "rolling-prev-month"
# Outbound-call budget per Notion-sync invocation (core Notion/API fetches).
# Keeps runs under the Workers subrequest cap; the hourly drain carries over.
SYNC_MAX_SUBREQUESTS = "20"

# Secrets — set with `npx wrangler secret put <NAME>` inside this directory.
# NEVER put these in this file:
#   NOTION_TOKEN
#   NOTION_DATA_SOURCE_ID
#   SALES_SYNC_API_TOKEN
#   RESEND_API_KEY
#   GSC_CLIENT_ID
#   GSC_CLIENT_SECRET
#   GSC_REFRESH_TOKEN
#   GA4_CLIENT_ID
#   GA4_CLIENT_SECRET
#   GA4_REFRESH_TOKEN
#   ETSY_CLIENT_ID
#   ETSY_CLIENT_SECRET
#   ETSY_REFRESH_TOKEN
#   ETSY_SHOP_ID
#   GOOGLE_ADS_CLIENT_ID
#   GOOGLE_ADS_CLIENT_SECRET
#   GOOGLE_ADS_REFRESH_TOKEN
